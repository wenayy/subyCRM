version: "3.9"

services:
  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file: .env.production
    environment:
      REDIS_URL: redis://redis:6379
      PORT: 4002
    ports:
      - "4002:4002"
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: always
    env_file: .env.production
    environment:
      PORT: 3005
    ports:
      - "3005:3005"
    depends_on:
      - api

volumes:
  redis-data:
