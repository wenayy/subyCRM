version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: suby
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: suby
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suby -d suby"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file: .env.production
    environment:
      REDIS_URL: redis://redis:6379
      PORT: 4002
      DATABASE_URL: postgresql://suby:${POSTGRES_PASSWORD}@postgres:5432/suby
      DIRECT_URL: postgresql://suby:${POSTGRES_PASSWORD}@postgres:5432/suby
    ports:
      - "4002:4002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: always
    env_file: .env.production
    environment:
      PORT: 3005
    ports:
      - "3005:3005"
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
